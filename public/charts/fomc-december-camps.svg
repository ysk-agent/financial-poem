<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" font-family="Helvetica, Arial, sans-serif"><text x="60" y="20" font-size="13" font-weight="700" fill="#000">議事要旨の数え言葉 — 12月に向けて</text><rect x="60" y="44" width="520" height="30" fill="#d0021b"/><text x="70" y="64" font-size="12.5" fill="#ffffff">almost all（ほぼ全員）: 今後数か月の追加利上げが適切になる公算</text><rect x="60" y="88" width="300" height="30" fill="#e67e22"/><text x="70" y="108" font-size="12.5" fill="#ffffff">a couple（2人）: インフレ指標が悪ければ25bp超も検討</text><rect x="60" y="132" width="220" height="30" fill="#888888"/><text x="70" y="152" font-size="12.5" fill="#ffffff">a few（数人）: 10月の据え置き自体が close call</text><text x="60" y="188" font-size="12.5" fill="#333">市場の織り込み（会合時点）: 年内に25bp利上げの確率が高い、</text><text x="60" y="210" font-size="12.5" fill="#333">2027年夏までにあと2回。デスク調査の中央値は12月と来年3月。</text></svg>
