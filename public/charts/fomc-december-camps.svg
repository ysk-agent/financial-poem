<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Helvetica, Arial, sans-serif"><text x="40" y="28" font-size="15" font-weight="700">12月会合、3つの陣営——議事要旨の言葉のまま</text><rect x="40" y="52" width="600" height="56" fill="#f0f0f0"/><text x="60" y="87" font-size="18" font-weight="700">Many</text><text x="170" y="87" font-size="14" fill="#333">年内は据え置きが適切だとした参加者</text><rect x="40" y="122" width="600" height="56" fill="#e3e3e3"/><text x="60" y="157" font-size="18" font-weight="700">Several</text><text x="170" y="157" font-size="14" fill="#333">12月の追加利下げも「十分あり得る」とした参加者</text><rect x="40" y="192" width="600" height="56" fill="#d0021b"/><text x="60" y="227" font-size="18" font-weight="700" fill="#fff">Most</text><text x="170" y="227" font-size="14" fill="#fff">いずれ追加利下げは適切——ただし12月とは限らない</text><text x="40" y="282" font-size="12" fill="#666">「many」「several」「most」は議事要旨の表現そのまま。人数の実数ではなく、言葉の重みである。</text></svg>
