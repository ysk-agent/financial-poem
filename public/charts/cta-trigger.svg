<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="Helvetica, Arial, sans-serif"><text x="52" y="22" font-size="13" font-weight="700">トレンド・トリガーの概念図 — 価格が移動平均を割ると、関数は売り手に変わる</text><line x1="52" y1="120" x2="646" y2="120" stroke="#000" stroke-width="1.6" stroke-dasharray="7 4"/><text x="646" y="112" text-anchor="end" font-size="12">200日移動平均（例）</text><path d="M60,70 L200,58 L330,84 L430,128 L520,168 L640,182" fill="none" stroke="#d0021b" stroke-width="2.6"/><rect x="52" y="120" width="594" height="86" fill="#d0021b" opacity="0.07"/><text x="150" y="46" font-size="12.5" font-weight="700">トレンド追随：買い持ち（ロング）</text><text x="470" y="196" font-size="12.5" font-weight="700" fill="#d0021b">割り込み：機械的な売り／ショート転換</text><circle cx="430" cy="128" r="5" fill="#000"/><text x="430" y="112" text-anchor="middle" font-size="12">交点＝トリガー</text></svg>