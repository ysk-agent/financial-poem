<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" font-family="Helvetica, Arial, sans-serif"><text x="60" y="20" font-size="13" font-weight="700" fill="#000">10月27〜28日会合の決定（2026年）</text><rect x="60" y="48" width="430" height="30" fill="#333333"/><text x="70" y="68" font-size="12.5" fill="#ffffff">据え置きに賛成 10人（3.75〜4.00%を維持）</text><rect x="60" y="92" width="86" height="30" fill="#d0021b"/><text x="70" y="112" font-size="12.5" fill="#ffffff">反対 2人</text><text x="156" y="112" font-size="12.5" font-weight="700" fill="#d0021b">クック／ハマック — 25bp利上げを希望</text><text x="60" y="152" font-size="12.5" fill="#333">9月会合は利上げ。前回からの流れは「引き締めの継続」である。</text><text x="60" y="176" font-size="12.5" fill="#333">声明文の一文: 「The Committee will deliver price stability.」</text><text x="60" y="200" font-size="12.5" fill="#333">次回会合は12月8〜9日。議長はウォーシュ。</text></svg>
