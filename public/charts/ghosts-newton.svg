<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="Helvetica, Arial, sans-serif"><text x="30" y="26" font-size="13" font-weight="700">ニュートン的反応：規制は問題を消さず、断片化して拡散させる（概念図）</text><text x="30" y="48" font-size="12" font-weight="700">2012年スペイン</text><rect x="30" y="58" width="180" height="52" fill="none" stroke="#000" stroke-width="1.6"/><text x="120" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#000">空売りの全面禁止</text><text x="120" y="98" text-anchor="middle" font-size="11" fill="#555">作用</text><path d="M226,84 l16,0 M12,79 l6,5 l-6,5" stroke="#000" stroke-width="1.6" fill="none" transform="translate(214,0)"/><rect x="245" y="58" width="180" height="52" fill="none" stroke="#000" stroke-width="1.6"/><text x="335" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#000">関連市場へ飛び火</text><text x="335" y="98" text-anchor="middle" font-size="11" fill="#555">反作用</text><path d="M441,84 l16,0 M12,79 l6,5 l-6,5" stroke="#000" stroke-width="1.6" fill="none" transform="translate(429,0)"/><rect x="460" y="58" width="180" height="52" fill="none" stroke="#d0021b" stroke-width="1.6"/><text x="550" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#d0021b">問題の断片化・拡散</text><text x="550" y="98" text-anchor="middle" font-size="11" fill="#555">新たな問題群</text><text x="30" y="140" font-size="12" font-weight="700">2026年の輸出規制</text><rect x="30" y="150" width="180" height="52" fill="none" stroke="#000" stroke-width="1.6"/><text x="120" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#000">半導体輸出規制</text><text x="120" y="190" text-anchor="middle" font-size="11" fill="#555">作用</text><path d="M226,176 l16,0 M12,171 l6,5 l-6,5" stroke="#000" stroke-width="1.6" fill="none" transform="translate(214,0)"/><rect x="245" y="150" width="180" height="52" fill="none" stroke="#000" stroke-width="1.6"/><text x="335" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#000">第三国経由の迂回</text><text x="335" y="190" text-anchor="middle" font-size="11" fill="#555">反作用</text><path d="M441,176 l16,0 M12,171 l6,5 l-6,5" stroke="#000" stroke-width="1.6" fill="none" transform="translate(429,0)"/><rect x="460" y="150" width="180" height="52" fill="none" stroke="#d0021b" stroke-width="1.6"/><text x="550" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#d0021b">見えない経路の増殖</text><text x="550" y="190" text-anchor="middle" font-size="11" fill="#555">新たな問題群</text><text x="30" y="242" font-size="12" fill="#333">Macro Man #1295 の比喩は油タンカー「トーリー・キャニオン」：難破船を爆破したら、油は消えずに広がった。</text></svg>