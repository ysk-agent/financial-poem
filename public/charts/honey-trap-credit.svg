<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" font-family="Helvetica, Arial, sans-serif"><text x="60" y="20" font-size="13" font-weight="700" fill="#000">信用評価損益率の物差し（%）</text><line x1="500" y1="36" x2="500" y2="150" stroke="#000" stroke-width="1"/><text x="500" y="168" text-anchor="middle" font-size="12" fill="#333">0%</text><rect x="290" y="52" width="210" height="24" fill="#888888"/><text x="210" y="69" text-anchor="end" font-size="12.5">通常のショック</text><text x="279" y="69" text-anchor="end" font-size="12.5" font-weight="700" fill="#555555">-15%前後</text><rect x="220" y="92" width="280" height="24" fill="#d0021b"/><text x="210" y="109" text-anchor="end" font-size="12.5">今回</text><text x="490" y="109" text-anchor="end" font-size="12.5" font-weight="700" fill="#ffffff">-20%超</text><text x="60" y="192" font-size="11.5" fill="#333">-20%はリーマン／コロナ級でしか届かない水準。セリング・クライマックス近傍の目安になる。</text></svg>
