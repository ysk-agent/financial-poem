<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="Helvetica, Arial, sans-serif"><text x="56" y="22" font-size="13" font-weight="700">市場に向き合った時間の累計：集中型（年5,000時間）と分散型（年1,000時間）</text><line x1="56" y1="222" x2="650" y2="222" stroke="#e3e3e3"/><text x="50" y="226" text-anchor="end" font-size="12" fill="#333">0k</text><line x1="56" y1="154" x2="650" y2="154" stroke="#e3e3e3"/><text x="50" y="158" text-anchor="end" font-size="12" fill="#333">20k</text><line x1="56" y1="87" x2="650" y2="87" stroke="#e3e3e3"/><text x="50" y="91" text-anchor="end" font-size="12" fill="#333">40k</text><path d="M56,222 L254,53" stroke="#d0021b" stroke-width="2.4" fill="none"/><path d="M56,222 L610,127" stroke="#000" stroke-width="2.4" fill="none"/><circle cx="167" cy="127" r="4.5" fill="#d0021b"/><text x="167" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#d0021b">5.6年で追いつく</text><text x="262" y="53" font-size="12" font-weight="700" fill="#d0021b">集中型：10年で50,000時間</text><text x="452" y="122" font-size="12" font-weight="700">分散型：28年で28,000時間</text><text x="56" y="242" text-anchor="middle" font-size="12" fill="#333">0年</text><text x="254" y="242" text-anchor="middle" font-size="12" fill="#333">10年</text><text x="452" y="242" text-anchor="middle" font-size="12" fill="#333">20年</text><text x="650" y="242" text-anchor="middle" font-size="12" fill="#333">30年</text></svg>