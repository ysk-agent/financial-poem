<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif"><text x="40" y="22" font-size="13" font-weight="700">ディーラー・ガンマ：同じヘッジが、安定装置にも増幅器にもなる</text><text x="170" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#000">ロング・ガンマ（顧客がオプションを売った側）</text><line x1="40" y1="140" x2="300" y2="140" stroke="#999"/><path d="M70,82 L145,132" stroke="#000" stroke-width="2.2" fill="none"/><path d="M145,132 L220,106 L278,114" stroke="#000" stroke-width="2.2" fill="none"/><text x="70" y="164" font-size="11.5" fill="#333">下げでは買う</text><text x="200" y="164" font-size="11.5" fill="#333">上げでは売る</text><text x="170" y="188" text-anchor="middle" font-size="12">値動きを消す方向にヘッジ → 市場は静かになる</text><text x="510" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#d0021b">ショート・ガンマ（顧客がオプションを買った側）</text><line x1="380" y1="140" x2="640" y2="140" stroke="#999"/><path d="M410,114 L500,106 L570,68 L618,36" stroke="#d0021b" stroke-width="2.2" fill="none"/><path d="M410,114 L500,106 L570,126 L618,142" stroke="#d0021b" stroke-width="2.2" fill="none" stroke-dasharray="4 3"/><text x="410" y="164" font-size="11.5" fill="#333">下げでは売る</text><text x="540" y="164" font-size="11.5" fill="#333">上げでは買う</text><text x="510" y="188" text-anchor="middle" font-size="12">値動きを追う方向にヘッジ → 市場は荒れる</text></svg>