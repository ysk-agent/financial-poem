<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif"><text x="30" y="26" font-size="13" font-weight="700">引かれた3枚と、その直後に来たもの</text><line x1="30" y1="120" x2="655" y2="120" stroke="#999" stroke-width="2"/><circle cx="110" cy="120" r="6" fill="#d0021b"/><text x="110" y="62" text-anchor="middle" font-size="12" font-weight="700">2007-08-28</text><text x="110" y="82" text-anchor="middle" font-size="12" fill="#333">#323 nursery rhymes</text><text x="110" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#d0021b">→ 2008年、危機の本番</text><circle cx="330" cy="120" r="6" fill="#d0021b"/><text x="330" y="62" text-anchor="middle" font-size="12" font-weight="700">2008-12-17</text><text x="330" y="82" text-anchor="middle" font-size="12" fill="#333">#695 steamroller</text><text x="330" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#d0021b">→ QEとCTAの時代</text><circle cx="550" cy="120" r="6" fill="#d0021b"/><text x="550" y="62" text-anchor="middle" font-size="12" font-weight="700">2012-07-24</text><text x="550" y="82" text-anchor="middle" font-size="12" fill="#333">#1295 newton</text><text x="550" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#d0021b">→ 2日後、ドラギ「whatever it takes」</text><text x="342" y="192" text-anchor="middle" font-size="12" fill="#333">3枚とも「事件の直前」に書かれていた。アーカイブは予言ではないが、時代の空気は保存する。</text></svg>