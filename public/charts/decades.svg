<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif"><text x="10" y="22" font-size="13" font-weight="700">10年ごとの金建てS&amp;P500の変化率</text><rect x="200" y="48" width="54" height="20" fill="#000"/><text x="100" y="63" text-anchor="end" font-size="12" fill="#333">1960s</text><text x="262" y="63" text-anchor="start" font-size="12.5" font-weight="700" fill="#000">+66%</text><rect x="126" y="81" width="74" height="20" fill="#d0021b"/><text x="100" y="96" text-anchor="end" font-size="12" fill="#333">1970s</text><text x="118" y="96" text-anchor="end" font-size="12.5" font-weight="700" fill="#d0021b">-90%</text><rect x="200" y="114" width="337" height="20" fill="#000"/><text x="100" y="129" text-anchor="end" font-size="12" fill="#333">1980s</text><text x="545" y="129" text-anchor="start" font-size="12.5" font-weight="700" fill="#000">+411%</text><rect x="200" y="147" width="449" height="20" fill="#000"/><text x="100" y="162" text-anchor="end" font-size="12" fill="#333">1990s</text><text x="657" y="162" text-anchor="start" font-size="12.5" font-weight="700" fill="#000">+547%</text><rect x="134" y="180" width="66" height="20" fill="#d0021b"/><text x="100" y="195" text-anchor="end" font-size="12" fill="#333">2000s</text><text x="126" y="195" text-anchor="end" font-size="12.5" font-weight="700" fill="#d0021b">-80%</text><rect x="200" y="213" width="104" height="20" fill="#000"/><text x="100" y="228" text-anchor="end" font-size="12" fill="#333">2010s</text><text x="312" y="228" text-anchor="start" font-size="12.5" font-weight="700" fill="#000">+127%</text><rect x="191" y="246" width="9" height="20" fill="#d0021b"/><text x="100" y="261" text-anchor="end" font-size="12" fill="#333">2020s（途中）</text><text x="183" y="261" text-anchor="end" font-size="12.5" font-weight="700" fill="#d0021b">-11%</text><line x1="200" y1="38" x2="200" y2="273" stroke="#999"/></svg>